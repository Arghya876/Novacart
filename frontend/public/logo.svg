<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="novaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>

  <!-- Rounded Bag Body -->
  <rect x="20" y="32" width="60" height="56" rx="14" fill="url(#novaGrad)"/>

  <!-- Shopping Bag Handles -->
  <path d="M 36 32 C 36 18, 64 18, 64 32" fill="none" stroke="url(#novaGrad)" stroke-width="7" stroke-linecap="round"/>

  <!-- Nova Star / Sparkle in Center -->
  <path d="M 50 44 Q 50 56, 62 56 Q 50 56, 50 68 Q 50 56, 38 56 Q 50 56, 50 44 Z" fill="#FFFFFF"/>
  <circle cx="66" cy="46" r="3" fill="url(#sparkGrad)"/>
</svg>
